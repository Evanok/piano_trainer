# deploy_kit settings for Piano Trainer (see ~/work/deploy_kit/README.md).
# No secrets and no host here: this repository is public.
APP=piano_trainer
KIND=node
BRANCH=master

# Local gate: nothing is sent if one of these fails.
CHECK_CMD="npm test && npm run lint && npm run build"

# Server side, in the new release directory.
REMOTE_BUILD="npm ci --no-audit --no-fund && npm run build"

# Outlive releases (in ~/apps/piano_trainer/shared, symlinked into each release).
# public/audio is a manual, untracked copy of the backing tracks; the build copies it into dist/.
SHARED="data public/audio piano-trainer.env"
MIGRATE_FROM=/home/arthur/work/piano_trainer

PM2_NAME=piano-trainer-prod
# nginx proxies the public HTTPS subdomain to 127.0.0.1:5173.
PM2_START='set -a; . ./piano-trainer.env; set +a; PORT=5173 HOST=127.0.0.1 pm2 start npm --name piano-trainer-prod -- start'
HEALTH_URL=http://127.0.0.1:5173/

PREDEPLOY_BACKUP="deploy/backup_data.sh predeploy"
